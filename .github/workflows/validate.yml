name: Validate

# Runs on every push and every pull request, including from forks. Fork pull
# requests deliberately use the `pull_request` event and never
# `pull_request_target`: the former checks out untrusted code with a read-only
# token and no access to secrets, which is exactly what we want.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema and semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate every conjecture file
        run: npm run validate

      # Ordinary writes only touch records whose content changed, so anything
      # that edits YAML without going through the canonical serializer leaves
      # the corpus in two formats and every later diff carries the reflow.
      - name: Check the corpus is canonically formatted
        run: npm run format -- --check

      # The semantic rules are easy to write so that they pass on every real
      # record and catch nothing, so they are exercised against known-bad input.
      - name: Self-test the semantic rules
        run: npm run selftest

      - name: Typecheck the ingest pipeline
        run: npm run typecheck --workspace ingest

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the search index
        run: npm run build:index

      - name: Typecheck the site
        run: npm run typecheck --workspace web

      - name: Build the site
        run: npm run build --workspace web
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-build-placeholder-secret-at-least-32-chars
