name: Sweep

# Watches free sources for claimed resolutions and opens a pull request adding
# unverified claims. Merging that pull request is the review step -- nothing
# here changes a conjecture's status on its own.
#
# Two phases on two schedules, sharing a queue in the Actions cache:
#
#   watch     hourly. Fetches every source, drops what we have already seen,
#             matches the rest to conjectures by name and enqueues. No model
#             calls, so an extra run costs nothing but Actions minutes.
#
#   classify  every three hours. Drains the front of the queue through the
#             classifier under a budget, writes claims and opens the pull
#             request.
#
# Splitting them cut detection latency from six hours to one without changing
# what we spend on the classifier, which is the part that actually costs money.
#
# This runs in Actions rather than on Vercel because the Vercel Hobby plan caps
# cron at once per day, while Actions minutes are free and unmetered on public
# repositories.
on:
  schedule:
    # Offset off the hour to avoid the scheduler's peak, where jobs are
    # routinely delayed or dropped.
    - cron: "17 * * * *"
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Which phase to run
        required: false
        default: both
        type: choice
        options: [both, watch, classify]
      window_days:
        description: How many days back to consider
        required: false
        default: "14"
      budget:
        description: Maximum classifier calls
        required: false
        default: "60"

permissions:
  contents: write
  pull-requests: write

# The two phases share one cache lineage and one queue file, so they must never
# run concurrently.
concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      PHASE: ${{ inputs.phase || (github.event.schedule == '47 */3 * * *' && 'classify' || 'watch') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Remembering what we have already looked at is what keeps the classifier
      # budget from being spent re-reading the same arXiv listing every run, and
      # it is how the watch phase hands work to the classify phase.
      - name: Restore sweep memory
        uses: actions/cache/restore@v5
        with:
          path: ingest/.cache
          key: sweep-cache-${{ github.run_id }}
          restore-keys: sweep-cache-

      - name: Run the sweep
        id: sweep
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Set whichever one matches the account you have. ANTHROPIC_API_KEY on
          # its own selects the Anthropic wire format, which is not a base-URL
          # swap; LLM_PROVIDER only matters if more than one key is present.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          # Neither is sensitive, so a repository variable is the natural home.
          # Granting a token the Variables permission is a separate step from
          # Secrets though, so fall back to a secret of the same name and let
          # whoever is configuring this use whichever they can already write.
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_DAILY_BUDGET: ${{ vars.LLM_DAILY_BUDGET || secrets.LLM_DAILY_BUDGET }}
          LLM_MIN_INTERVAL_MS: ${{ vars.LLM_MIN_INTERVAL_MS || secrets.LLM_MIN_INTERVAL_MS }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Lifts the GitHub API from 60 requests an hour to 5,000, which the
          # formal-conjectures and erdosproblems watches need at this cadence.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--phase "$PHASE"
                --window "${{ inputs.window_days || '14' }}"
                --budget "${{ inputs.budget || '60' }}"
                --report /tmp/sweep-report.json)
          if [ "$PHASE" != "watch" ]; then
            ARGS+=(--write --pr-body /tmp/pr-body.md)
          fi
          npx tsx ingest/src/cli/sweep.ts "${ARGS[@]}"

      # A pull request opened with GITHUB_TOKEN does not trigger other
      # workflows, so Validate will not run on it. Validate here instead.
      - name: Validate what the sweep wrote
        if: env.PHASE != 'watch' && steps.sweep.outputs.written != '0'
        run: npm run validate

      - name: Open or update the pull request
        if: env.PHASE != 'watch' && steps.sweep.outputs.written != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="sweep/$(date -u +%Y-%m-%d)"

          git config user.name "conjecturehub-bot"
          git config user.email "bot@conjecturehub.org"

          # Commit before going anywhere near the branch. The sweep has already
          # written to conjectures/, and `git checkout` of an existing branch
          # refuses to move a dirty tree — which is how a run's claims got
          # written, validated, and then thrown away with the runner.
          git checkout -B "$BRANCH"
          git add conjectures/
          git commit -m "sweep: ${{ steps.sweep.outputs.written }} unverified claim(s) from $(date -u +%Y-%m-%d)"

          # The day's branch usually exists already, because classify runs every
          # three hours. Land on top of it rather than trying to fast-forward
          # over it, which is a guaranteed rejected push.
          if git fetch origin "$BRANCH" 2>/dev/null; then
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              BRANCH="$BRANCH-run${GITHUB_RUN_ID}"
              git checkout -B "$BRANCH"
              echo "::warning::Could not rebase onto today's branch; opening $BRANCH instead."
            fi
          fi

          git push --set-upstream origin "$BRANCH"

          # A missing label makes gh pr create exit non-zero after the push,
          # stranding the branch with no pull request. Ensure they exist.
          gh label create sweep --color 1d76db --description "Opened by the automated sweep" --force
          gh label create unverified --color fbca04 --description "Contains claims no one has verified" --force

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sweep: ${{ steps.sweep.outputs.written }} unverified claim(s), $(date -u +%Y-%m-%d)" \
              --body-file /tmp/pr-body.md \
              --label "sweep" \
              --label "unverified"
          fi

      # Saved only once the claims are durable. Recording a drained queue while
      # the pull request step is still ahead of us is how 16 classified claims
      # were written, validated, and then lost: nothing would ever rediscover
      # them, because the queue already said they had been handled. Redoing the
      # classifier calls is cheap by comparison.
      - name: Save sweep memory
        if: success()
        uses: actions/cache/save@v5
        with:
          path: ingest/.cache
          key: sweep-cache-${{ github.run_id }}

      # Always, and deliberately: this artifact is the only surviving record of
      # what a failed classify run wrote, and apply-sweep-report.ts replays it.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sweep-report-${{ env.PHASE }}-${{ github.run_id }}
          path: /tmp/sweep-report.json
          if-no-files-found: ignore
          retention-days: 14
