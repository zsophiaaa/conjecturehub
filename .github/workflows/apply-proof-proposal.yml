name: Apply approved proof proposal

# The workflow calls back into the site to fetch the submitted Lean source and to
# report progress, so SITE_URL has to point at the running deployment. The
# fallback below is the current one; override it with a SITE_URL repository
# variable (or secret, if the configuring token lacks the Variables permission)
# once a custom domain is live. Getting it wrong fails with curl exit 6 and no
# other explanation, because the host simply does not resolve.
on:
  repository_dispatch:
    types: [verify-proof-proposal]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Lean source from site
        id: fetch
        env:
          PROPOSAL_ID: ${{ github.event.client_payload.proposalId }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://conjecture-hub-test.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # Outside the working tree: create-pull-request commits whatever it
          # finds there, and this response has no business in the repository.
          curl -sf \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/v1/internal/proof-proposals/$PROPOSAL_ID" \
            -o /tmp/proposal.json
          echo "conjecture=$(jq -r .conjectureId /tmp/proposal.json)" >> "$GITHUB_OUTPUT"
          jq -r .leanBody /tmp/proposal.json > /tmp/solution.lean

      # The path is the whole mechanism: verify-lean.yml selects a challenge only
      # when the file its config names has changed, so a proof written anywhere
      # else sails through the pull request unchecked.
      - name: Write the solution where its challenge expects it
        env:
          CONJECTURE: ${{ steps.fetch.outputs.conjecture }}
        run: |
          set -euo pipefail
          target="$(python3 .github/scripts/solution-path.py "$CONJECTURE" /tmp/solution.lean)"
          mkdir -p "$(dirname "$target")"
          cp /tmp/solution.lean "$target"
          echo "wrote $target"

      - name: Notify job running
        env:
          JOB_ID: ${{ github.event.client_payload.jobId }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://conjecture-hub-test.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X POST \
            -H "content-type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/v1/webhooks/verify" \
            -d "{\"jobId\":$JOB_ID,\"status\":\"running\",\"workflowRunId\":\"${{ github.run_id }}\",\"logUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Proof proposal #${{ github.event.client_payload.proposalId }}"
          title: "Proof proposal #${{ github.event.client_payload.proposalId }}"
          body: "Curator-approved Lean proof from ConjectureHub community layer."
          branch: "proof-proposal-${{ github.event.client_payload.proposalId }}"
          delete-branch: true

      - name: Mark job pending verification
        if: always()
        env:
          JOB_ID: ${{ github.event.client_payload.jobId }}
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL || 'https://conjecture-hub-test.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf -X POST \
            -H "content-type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/v1/webhooks/verify" \
            -d "{\"jobId\":$JOB_ID,\"status\":\"pending\",\"logUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
