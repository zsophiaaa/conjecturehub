# A dated snapshot, not a live feed. The forum index at
# https://www.erdosproblems.com/forum lists every problem thread with a post-count
# badge; these numbers were read from it (and cross-checked against individual
# problem pages where noted). Builds must not hit the network, so the snapshot
# lives here and is refreshed by hand or by a scheduled job.
#
# This exists because the first cut at a "popularity" sort ranked problems by how
# many forum claims we had curated, which is circular: a problem looked popular
# because we had already written about it. These are counts we did not author.
