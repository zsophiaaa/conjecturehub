      Reviewed 2026-08-03: A corollary of ternary Goldbach, and its only unconditional resolution is Helfgott's 2013 manuscript (arXiv:1312.7748), accepted in principle by Annals of Mathematics Studies in 2015 but still in revision and never printed. Before that the result was known only conditionally on GRH (Deshouillers–Effinger–te Riele–Zinoviev 1997). Experts treat it as settled; the literature does not yet record it as published. See https://arxiv.org/abs/1312.7748.
