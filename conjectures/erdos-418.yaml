id: erdos-418
title: Erdős Problem 418
statement:
  informal: |-
    Call a positive integer a non-cototient if it is not of the form $n-\phi(n)$ for any $n\geq 1$, where $\phi$ is Euler's totient function. Are there infinitely many non-cototients?

    Asked by Erdős and Sierpiński. A slight strengthening of the Goldbach conjecture implies that every odd number is of the form $n-\phi(n)$, so the question is really about even numbers. The answer is yes: Browkin and Schinzel [BrSc95] proved that every integer $2^k\cdot 509203$ with $k\geq 1$ is a non-cototient, and this has been verified in Lean. It remains open whether the set of non-cototients has positive density. For comparison, Erdős [Er73b] showed that the integers not of the form $\sigma(n)-n$ (the untouchable numbers) have positive density; Banks and Luca [BaLu05] gave lower density $\geq 1/48$, improved to $0.06$ by Chen and Zhao [ChZh11], and Pollack and Pomerance [PoPo16] heuristically predict a density of about $0.17$.
