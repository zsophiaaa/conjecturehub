id: exponentials-conjectures-and-theorems
title: Exponentials conjectures and theorems
statement:
  informal: |-
    **Four exponentials conjecture**
    Let $x_0, x_1$ and $y_0, y_1$ be $\mathbb Q$-linearly independent pairs of complex numbers,
    then some $e^{x_i y_j}$ is transcendental.
  formal:
    - language: lean4
      theorem: four_exponentials_conjecture
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/Exponentials.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
    - language: lean4
      theorem: two_pow_three_pow_transcendental
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/Exponentials.lean
