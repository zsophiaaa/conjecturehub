      Reviewed 2026-08-03: Kolmogorov (1956) and Arnold (1957) refuted Hilbert's expectation for continuous functions. The algebraic variant — solving the general degree-7 equation with algebraic functions of two variables, which is most likely what Hilbert meant — is still open. A bare 'disproved' is close to a false positive here. See https://en.wikipedia.org/wiki/Hilbert%27s_thirteenth_problem.
