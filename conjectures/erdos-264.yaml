id: erdos-264
title: Erdős Problem 264
statement:
  informal: |-
    Call a sequence $a_1, a_2, \ldots$ of positive integers an *irrationality sequence* if for every bounded sequence of integers $b_n$ with $b_n \neq 0$ and $a_n + b_n \neq 0$ for all $n$, the sum
    $$\sum_n \frac{1}{a_n + b_n}$$
    is irrational. Erdős and Graham asked whether $a_n = 2^n$ and $a_n = n!$ are examples of such sequences. Kovač and Tao proved that $2^n$ is not an irrationality sequence — more generally, no strictly increasing sequence with $\sum 1/a_n$ convergent and $\liminf\, a_n^2\sum_{k>n} a_k^{-2} > 0$ is, which covers every strictly increasing sequence with $\limsup a_{n+1}/a_n < \infty$ — while $a_n = 2^{2^n}$ is one. Is $a_n = n!$ an irrationality sequence?
