id: equational-theories
title: Equational Theories
statement:
  informal: |-
    A *magma* is a set $M$ equipped with a single binary operation $\diamond$ satisfying no axioms. Consider two equational laws, required to hold for all elements of $M$:
    $$x = y \diamond \bigl(x \diamond ((y \diamond x) \diamond y)\bigr) \qquad\text{(law 677)}$$
    $$x = ((x \diamond x) \diamond x) \diamond x \qquad\text{(law 255)}$$
    Does every *finite* magma satisfying law 677 also satisfy law 255? Equivalently, is there a finite magma satisfying law 677 together with an element $x$ for which $((x\diamond x)\diamond x)\diamond x \neq x$? Without the finiteness restriction the implication is known to fail, but the known counterexample comes from a greedy construction that is inherently infinite, and it is also known that law 255 does not imply law 677 (a $3$-element magma suffices). This is the one implication, up to duality, that the Equational Theories Project could not settle among the roughly $2.2\times 10^{7}$ implications between the $4694$ laws it considered; its authors tentatively conjecture that a finite counterexample does exist.
