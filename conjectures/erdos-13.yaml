id: erdos-13
title: Erdős Problem 13
statement:
  informal: |-
    Let $A\subseteq\{1,\ldots,N\}$ contain no three elements $a,b,c$ with $a<\min(b,c)$ and $a\mid(b+c)$. Is it true that $|A|\leq N/3+O(1)$?

    Asked by Erdős and Sárközy, who observed that $A=(2N/3,N]\cap\mathbb{N}$ has this property, so the bound would be essentially sharp; Erdős offered \$100 for a solution. The answer is yes: Bedert [Be23] proved that in fact $|A|\leq\lfloor N/3\rfloor+1$ for all sufficiently large $N$. The general version Erdős raised in [Er92c] is still open: if $A\subseteq\{1,\ldots,N\}$ has no $a,b_1,\ldots,b_r\in A$ with $a<\min(b_1,\ldots,b_r)$ and $a\mid(b_1+\cdots+b_r)$, must $|A|\leq N/(r+1)+O(1)$?
