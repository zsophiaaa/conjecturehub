  - id: erdos-180-forum-hunter-counterexample
    asserted_on: 2025-08-19
    type: disproved
    evidence_tier: community_accepted
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/180
      kind: forum
    authors:
      - Zach Hunter
    reviewer: teorth/erdosproblems maintainers
    notes: "Folklore counterexample: family {H1,H2} with H1 a star and H2 a matching gives ex(n;F)=O_F(1) but each Hi with ≥2 edges has ex(n,Hi)=Θ(n). Disproves the original compactness conjecture; conjecture may still hold for families outside this obstruction."
  - id: erdos-180-forum-star-matching-dichotomy
    asserted_on: 2026-04-28
    type: partial
    evidence_tier: preprint
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/180
      kind: forum
    ai_assistance:
      used: yes
      systems:
        - GPT-5.5
        - Claude Opus 4.7
      role: discovery
    notes: "Poster claims dichotomy: if every H∈F has ex(n;H)=Θ(n), then either F contains both K_{1,a} and bK_2 (ex(n;F)=Θ(1)) or no such pair (ex(n;F)=Θ(n)). Maintainer standard check: correct but modest, not found exactly in literature."
