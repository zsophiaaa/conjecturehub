statement:
  informal: |-
    **Compactness conjecture (Erdős 180).** If a family of forbidden finite graphs is
    "cyclic" (contains a non-acyclic member), then extremal numbers for that family should be
    bounded by a constant multiple of the family's own extremal function — a compactness property
    in Turán theory. OpenAI Astra (August 2026) announced a counterexample with a Lean 4
    certificate. Read the full problem at erdosproblems.com/180.
