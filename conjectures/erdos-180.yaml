  - asserted_on: 2026-01-01
    authors:
      - Zach Hunter
    evidence_tier: community_accepted
    id: erdos-180-forum-hunter-counterexample
    notes: >-
      Folklore counterexample: family {H1,H2} with H1 a star and H2 a matching gives ex(n;F)=O_F(1)
      but each Hi with ≥2 edges has ex(n,Hi)=Θ(n). Disproves the original compactness conjecture;
      conjecture may still hold for families outside this obstruction.
    recorded_on: 2026-08-02
    reviewer: teorth/erdosproblems maintainers
    source:
      kind: forum
      title: erdosproblems.com forum #180 — Hunter counterexample
      url: https://www.erdosproblems.com/forum/thread/180
    state: active
    type: disproved
  - asserted_on: 2026-06-01
    evidence_tier: preprint
    id: erdos-180-forum-star-matching-dichotomy
    notes: >-
      Poster claims dichotomy: if every H∈F has ex(n;H)=Θ(n), then either F contains both K_{1,a}
      and bK_2 (ex(n;F)=Θ(1)) or no such pair (ex(n;F)=Θ(n)). Maintainer standard check: correct
      but modest, not found exactly in literature.
