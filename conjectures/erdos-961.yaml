id: erdos-961
title: Erdős Problem 961
statement:
  informal: |-
    For $k \geq 1$ let $f(k)$ be the minimal $n$ such that every set of $n$ consecutive integers greater than $k$ contains an integer divisible by some prime $> k$; equivalently, $f(k)-1$ is the greatest possible length of a run of consecutive integers greater than $k$ all of whose prime factors are at most $k$. Estimate $f(k)$: it is believed that $f(k) \ll (\log k)^{O(1)}$, but this is far from what is known. Sylvester and Schur proved $f(k) \leq k$, Erdős proved $f(k) < 3\frac{k}{\log k}$, and Jutila and Ramachandra–Shorey proved
    $$f(k) \ll \frac{\log\log\log k}{\log\log k}\cdot\frac{k}{\log k}.$$
