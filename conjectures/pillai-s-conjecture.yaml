      Retracted 2026-08-03 after review: False positive. Pillai's conjecture is unsolved: it follows from abc and is known only for C = 1 (Tijdeman 1976) and when one variable is fixed. The 'proved' status is an artefact of the record's source URL pointing at the Catalan's conjecture article — what Mihăilescu proved in 2002 is Catalan, the special case C = 1, not Pillai. See https://webusers.imj-prg.fr/~michel.waldschmidt/articles/pdf/PerfectPowers.pdf.
