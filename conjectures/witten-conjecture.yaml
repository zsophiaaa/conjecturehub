    notes: |-
      Standing taken from English Wikipedia's categorisation (Wikipedia categorises this as proved). Nobody here has read the paper that settled it, which is what the secondary attestation says; replace this claim with one citing that paper when someone has it to hand.

      Retracted 2026-08-03 after review: At least two conjectures share the name. The moduli-of-curves/KdV version is fully proved (Kontsevich 1992). The gauge-theory version, that Donaldson invariants are determined by Seiberg–Witten invariants, is proved only for large classes of 4-manifolds and is not settled in general. Needs splitting before any status can be filed. See https://ncatlab.org/nlab/show/Witten+conjecture.
