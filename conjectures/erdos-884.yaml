    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/884
      kind: forum
    authors:
      - Daniel Larsen
    notes: Unconditional disproof by repeating Tao's construction across many scales so the left-hand pairwise sum grows without bound. Revised PDF posted 30 Mar 2026 after forum GPT-5.4 audit suggestions.
  - id: erdos-884-tao-larsen-endorsement
