  - id: erdos-884-tao-conditional-disproof
    asserted_on: 2025-09-10
    type: disproved
    scope: conditional on Hardy–Littlewood prime tuples
    evidence_tier: preprint
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/884
      kind: forum
    authors:
      - Terence Tao
    notes: Conditional negative answer assuming qualitative Hardy–Littlewood prime tuples. Constructs n from a K-separated admissible tuple so the pairwise-reciprocal-gap sum dominates the consecutive-gap sum; ratio unbounded. Tao noted the construction almost works unconditionally.
  - id: erdos-884-larsen-unconditional-disproof
    asserted_on: 2026-03-29
    type: disproved
    evidence_tier: preprint
    attestation: secondary
    state: active
