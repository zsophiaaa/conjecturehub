id: erdos-189
title: Erdős Problem 189
statement:
  informal: |-
    If $\mathbb{R}^2$ is coloured with finitely many colours, must some colour class contain the four vertices of a rectangle of every positive area?

    Asked by Erdős and Graham. The answer is no: Kovač [Ko23] exhibited an explicit $25$-colouring of the plane in which no class contains all four corners of a rectangle of area $1$ (his colouring is even Jordan measurable), and this disproof has been verified in Lean. By contrast, Graham [Gr80] showed that the corresponding statement for right-angled triangles is true, and it is false for rhombuses. The analogous question for parallelograms of every area remains open.
