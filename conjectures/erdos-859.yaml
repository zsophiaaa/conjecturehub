id: erdos-859
title: Erdős Problem 859
statement:
  informal: |-
    For an integer $t \geq 1$ let $d_t$ be the density of the set of integers $n \in \mathbb{N}$ for which $t$ can be represented as a sum of distinct divisors of $n$. Do there exist constants $c_1, c_2 > 0$ such that
    $$d_t \sim \frac{c_1}{(\log t)^{c_2}}$$
    as $t \to \infty$? Erdős proved that the density $d_t$ exists for every $t$, and that there are constants $c_3, c_4 > 0$ with
    $$\frac{1}{(\log t)^{c_3}} < d_t < \frac{1}{(\log t)^{c_4}}.$$
