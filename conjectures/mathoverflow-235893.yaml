title: Mathoverflow 235893
statement:
  informal: |-
    Assume for $n>1$, $f:\mathbb{R}^n\to\mathbb{R}^n$ is a bijection, where $\mathbb{R}^n$ is equipped
    with the standard topology. Does the connectedness of (the induced power set map) $f$ imply
    that of $f^{-1}$?
