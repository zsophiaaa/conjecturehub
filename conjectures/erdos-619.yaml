openness_basis:
  meaning: no_published_solution_known_to_curator
  asserted_by: erdosproblems.com
  asserted_on: 2026-06-22
  note: "Marked SOLVED (LEAN) on erdosproblems.com and settled in the negative. The 4-comment forum thread is short and consensual: the counterexample is a pendant-decorated triangle-free core whose key point is that triangle-freeness of the supergraph blocks the obvious hub shortcut, an objection the maintainer raised and retracted himself. Remaining discussion is refinement — an explicit error term, and a request that the core construction be attributed to Fiz Pontiveros, Griffiths and Morris. The finer-scale behaviour of h_4 is the one genuinely open loose end named by the maintainer."
