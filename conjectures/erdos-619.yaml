      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/619
      kind: forum
    authors:
      - Quanyu Tang
    notes: Notes the displayed definition should read "has diameter at most r" rather than "has diameter r", matching the original definition in EGR98, and that the closing question should specify a connected triangle-free graph. As of the 15 June 2026 page edit both wordings are unchanged. No reply appears in the thread.
