  - id: erdos-619-fable-counterexample-family
    asserted_on: 2026-06-14
    type: disproved
    scope: refutes the existence of any constant c > 0, for connected triangle-free graphs
    evidence_tier: community_accepted
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/619
      kind: forum
    authors:
      - Nick Kuhn
    ai_assistance:
      used: yes
      systems:
        - Claude Fable 5
        - Codex
        - GPT-5.5
      role: discovery
    notes: Disproof obtained 9 June 2026, with a Lean formalisation subsequently merged into the Formal Conjectures project. For any eta the construction takes a triangle-free core with small independence number and attaches pendant leaves to every core vertex. Any triangle-free diameter-4 supergraph must spend nearly one edge per pendant, because pendant components can only be joined through the core and triangle-freeness caps how many core pairs can be brought within distance 2. The maintainer's hub-vertex objection was withdrawn on noticing the supergraph must itself stay triangle-free.
  - id: erdos-619-quantitative-optimisation
    asserted_on: 2026-06-15
    type: partial
    scope: explicit error term; the finer-scale behaviour of h_4 remains undetermined
    evidence_tier: unverified_claim
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/619
      kind: forum
    authors:
      - Thomas Bloom
    notes: Optimises the counterexample parameters to show infinitely many connected graphs on n vertices satisfy h_4 at least n minus O(n^(8/9) (log n)^(2/9)). Also observes the core construction is standard and should be cited to Fiz Pontiveros, Griffiths and Morris. This bound now appears in the problem remarks. Recorded at the lowest tier because it is an unreviewed forum sketch by the maintainer himself.
