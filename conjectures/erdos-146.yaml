statement:
  informal: |-
    **Degeneracy conjecture (Erdős 146).** A conjecture in extremal graph theory on how
    Turán/extremal numbers of bipartite graphs with bounded degeneracy grow with `n`. OpenAI
    Astra (August 2026) announced a counterexample with a Lean 4 certificate in openai/ten-proofs.
    Read the full problem statement at erdosproblems.com/146.
