id: sum-of-three-cubes
title: Sum of three cubes
statement:
  informal: |-
    An integer `n : ℤ` can be written as a sum of three cubes (of integers) if and only if
    `n` is not `4` or `5` mod `9`.
  formal:
    - language: lean4
      theorem: isSumOfThreeCubesRat_any
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/SumOfThreeCubes.lean
      toolchain: v4.32.0
      category: research solved
      definition_hole: false
    - language: lean4
      theorem: isSumOfThreeCubes_iff_mod_9
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/SumOfThreeCubes.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
