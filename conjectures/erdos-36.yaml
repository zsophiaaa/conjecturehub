id: erdos-36
title: Erdős Problem 36
statement:
  informal: |-
    Let $N\geq 1$ and let $\{1,\ldots,2N\} = A \sqcup B$ be a partition into two sets of equal size $\lvert A\rvert = \lvert B\rvert = N$. For an integer $x$, let $r_{A,B}(x)$ be the number of pairs $(a,b) \in A\times B$ with $a-b=x$, and let
    $$M(N) = \min_{A\sqcup B} \max_{x\in\mathbb{Z}} r_{A,B}(x),$$
    the minimum being over all such balanced partitions. Erdős's *minimum overlap problem* asks for the optimal constant $c$ in the statement "for all sufficiently large $N$, every balanced partition of $\{1,\ldots,2N\}$ admits some $x$ with $r_{A,B}(x) \geq cN$"; equivalently, determine $c = \lim_{N\to\infty} M(N)/N$, which is known to exist. The trivial lower bound is $c \geq 1/4$ and the partition $A = \{N/2+1,\ldots,3N/2\}$ (for even $N$) gives $c \leq 1/2$; the current records are
    $$0.379005 < c < 0.380876,$$
    the lower bound due to White (2022).
