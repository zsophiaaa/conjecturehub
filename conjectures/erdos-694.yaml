    notes: >-
      GPT-5.5 Pro, prompted by Price, proved that the maximum of the ratio over n up to x equals
      (e^gamma + o(1)) log log x. The write-up was circulated as an Overleaf read-only link rather
      than a preprint server, which drew a side discussion about citation practice. The problem
      remarks now state this result and attribute it to GPT-5.5 Pro prompted by Price.
    ai_assistance:
