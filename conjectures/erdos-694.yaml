  - asserted_on: 2026-05-02
    authors:
      - Thomas Bloom
    evidence_tier: unverified_claim
    id: erdos-694-bloom-elementary-proof
    notes: >-
      The site maintainer gives a self-contained elementary derivation in a forum comment. The
      upper bound follows from the classical maximal order of m/phi(m) plus the trivial bound on
      f_max; the lower bound constructs an explicit pair with equal totient using a prime supplied
      by Linnik's theorem, so the ratio matches the Mertens product. Recorded at the lowest tier
      because it is an unreviewed forum comment by the maintainer himself.
    recorded_on: 2026-08-02
    scope: independent short proof of both the upper and the lower bound
    source:
      kind: forum
      title: erdosproblems.com forum #694 — elementary proof of matching bounds
      url: https://www.erdosproblems.com/forum/thread/694
    state: active
    type: proved
  - asserted_on: 2026-05-03
    evidence_tier: community_accepted
    id: erdos-694-lean-formalisation
    notes: >-
      Posted by forum user paws (no real name given on the site). A Lean 4 and Mathlib
      formalisation, type-checkable in browser and checked under Lean 4.27 and 4.28. Mertens'
      product theorem and a divisibility form of Linnik's theorem are assumed as axioms rather
      than proved. A later commenter reported that Aristotle subsequently discharged the Mertens
      axiom, leaving Linnik as the only remaining assumption.
    ai_assistance:
      used: yes
      systems:
        - Claude Code 4.7
        - GPT-5.5 Pro
      role: formalization
    recorded_on: 2026-08-02
    reviewer: Nat Sothanaphan
    scope: machine-checked statement of the asymptotic, modulo two number-theoretic axioms
    source:
      kind: forum
      title: erdosproblems.com forum #694 — Lean formalisation with Mertens and Linnik as axioms
      url: https://www.erdosproblems.com/forum/thread/694
    state: active
    type: reformulation
  - asserted_on: 2026-05-01
    evidence_tier: unverified_claim
    id: erdos-694-linnik-ineffectivity-caveat
    notes: >-
      Posted by forum user kv07 (no real name given on the site). Observes that the lower bound
      invokes Linnik's theorem, so without explicit constants one cannot exhibit a concrete
      extremal pair or say at what scale of x the bound becomes meaningful. With the best known
      exponent the threshold lies far beyond computational range. No rebuttal appears in the
      thread.
    recorded_on: 2026-08-02
    scope: effectivity of the lower-bound construction, not its correctness
    source:
      kind: forum
      title: erdosproblems.com forum #694 — non-explicitness of the Linnik-based construction
      url: https://www.erdosproblems.com/forum/thread/694
    state: active
    type: partial
