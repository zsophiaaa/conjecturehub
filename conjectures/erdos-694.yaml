openness_basis:
  asserted_by: erdosproblems.com
  asserted_on: 2026-05-06
  meaning: no_published_solution_known_to_curator
  note: >-
    Marked SOLVED (LEAN) on erdosproblems.com. An AI-produced proof pinned the maximum ratio at
    (e^gamma + o(1)) log log x on 1 May 2026, the maintainer independently re-derived it the next
    day in a few lines from classical estimates plus Linnik's theorem, and a Lean formalisation
    followed within two days. Remaining discussion in the 14-comment thread is scholarly hygiene
    rather than correctness. The one substantive unanswered caveat is that the lower-bound
    construction is wholly non-explicit because Linnik's constants are not pinned down, so the
    result has no effective content at any computable scale; the Lean artefact still assumes
    Linnik as an axiom.
