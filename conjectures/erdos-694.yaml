    reviewer: Thomas Bloom
    notes: GPT-5.5 Pro, prompted by Price, proved that the maximum of the ratio over n up to x equals (e^gamma + o(1)) log log x. The write-up was circulated as an Overleaf read-only link rather than a preprint server, which drew a side discussion about citation practice. The problem remarks now state this result and attribute it to GPT-5.5 Pro prompted by Price.
  - id: erdos-694-bloom-elementary-proof
    asserted_on: 2026-05-02
    type: proved
    scope: independent short proof of both the upper and the lower bound
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/694
      kind: forum
    authors:
      - Thomas Bloom
    notes: The site maintainer gives a self-contained elementary derivation in a forum comment. The upper bound follows from the classical maximal order of m/phi(m) plus the trivial bound on f_max; the lower bound constructs an explicit pair with equal totient using a prime supplied by Linnik's theorem, so the ratio matches the Mertens product. Recorded at the lowest tier because it is an unreviewed forum comment by the maintainer himself.
  - id: erdos-694-lean-formalisation
    asserted_on: 2026-05-03
    type: reformulation
    scope: machine-checked statement of the asymptotic, modulo two number-theoretic axioms
    evidence_tier: community_accepted
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/694
      kind: forum
    ai_assistance:
      used: yes
      systems:
        - Claude Code 4.7
        - GPT-5.5 Pro
      role: formalization
    reviewer: Nat Sothanaphan
    notes: Posted by forum user paws (no real name given on the site). A Lean 4 and Mathlib formalisation, type-checkable in browser and checked under Lean 4.27 and 4.28. Mertens' product theorem and a divisibility form of Linnik's theorem are assumed as axioms rather than proved. A later commenter reported that Aristotle subsequently discharged the Mertens axiom, leaving Linnik as the only remaining assumption.
  - id: erdos-694-linnik-ineffectivity-caveat
    asserted_on: 2026-05-01
    type: partial
    scope: effectivity of the lower-bound construction, not its correctness
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/694
      kind: forum
    notes: Posted by forum user kv07 (no real name given on the site). Observes that the lower bound invokes Linnik's theorem, so without explicit constants one cannot exhibit a concrete extremal pair or say at what scale of x the bound becomes meaningful. With the best known exponent the threshold lies far beyond computational range. No rebuttal appears in the thread.
