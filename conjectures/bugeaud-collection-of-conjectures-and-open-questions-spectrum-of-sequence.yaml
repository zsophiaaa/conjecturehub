id: bugeaud-collection-of-conjectures-and-open-questions-spectrum-of-sequence
title: "Bugeaud Collection of Conjectures and Open Questions: Spectrum of Sequence"
statement:
  informal: |-
    Problem 10.4. Let $\xi$ be a non-zero real number and $\alpha > 1$ be a real
    number. The spectrum of the sequence $(\xi \alpha^n)_{n \ge 1}$ is at most
    countable. Posed by Mendès France [Men73].
