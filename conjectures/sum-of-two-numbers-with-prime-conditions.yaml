id: sum-of-two-numbers-with-prime-conditions
title: Sum of two numbers with prime conditions
statement:
  informal: "The conjecture for sequence A231201: for any $n > 1$, there exist $x, y > 0$ such that $n = x + y$ and $2^x + y$ is prime."
