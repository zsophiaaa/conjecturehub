      theorem: jacobian_conjecture
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/JacobianConjecture.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
