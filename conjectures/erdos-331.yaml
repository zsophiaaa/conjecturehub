id: erdos-331
title: Erdős Problem 331
statement:
  informal: |-
    Let $A,B\subseteq\mathbb{N}$ be such that $|A\cap\{1,\ldots,N\}|\gg N^{1/2}$ and $|B\cap\{1,\ldots,N\}|\gg N^{1/2}$ for all large $N$. Must there be infinitely many solutions to $a_1-a_2=b_1-b_2\neq 0$ with $a_1,a_2\in A$ and $b_1,b_2\in B$?

    Asked by Erdős and Graham. The answer is no. Ruzsa observed the following counterexample: let $A$ be the integers whose binary expansion is supported on the even-indexed digits and $B$ those supported on the odd-indexed digits. Both counting functions grow like $\gg N^{1/2}$, yet every $n\geq 1$ has exactly one representation $n=a+b$ with $a\in A$, $b\in B$, so $a_1+b_2=a_2+b_1$ forces $a_1=a_2$. This has been verified in Lean. Ruzsa's suggested strengthening is open: does the conclusion hold if one assumes instead that $|A\cap\{1,\ldots,N\}|\sim c_AN^{1/2}$ and $|B\cap\{1,\ldots,N\}|\sim c_BN^{1/2}$ for constants $c_A,c_B>0$?
