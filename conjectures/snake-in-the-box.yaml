id: snake-in-the-box
title: Snake in the box
statement:
  informal: |-
    Let $Q_n$ be the $n$-dimensional hypercube graph: its vertices are the $2^n$ binary strings of length $n$, and two strings are adjacent when they differ in exactly one coordinate. A **snake in the box** is an induced path in $Q_n$, that is, a sequence of distinct vertices $v_0,v_1,\dots,v_k$ in which consecutive vertices are adjacent and no other pair $v_i,v_j$ is adjacent; equivalently, each time the path moves to a new corner of the cube, every neighbour of every previously visited corner becomes unusable. Its length is $k$, the number of edges. Writing $s(n)$ for the maximum length of a snake in $Q_n$, the values
    $$s(0),\dots,s(8)\;=\;0,\,1,\,2,\,4,\,7,\,13,\,26,\,50,\,98$$
    are known, but $s(9)$ is not: the longest snake found so far in $Q_9$ has length $191$, and no matching upper bound is available. The snake-in-the-box problem, raised by Kautz in 1958 in connection with single-error-detecting Gray codes, asks for $s(n)$ in general; dimension $9$ is the smallest unresolved case.
