id: erdos-160
title: Erdős Problem 160
statement:
  informal: |-
    For $N\geq 1$ let $h(N)$ be the smallest number of colours $k$ such that $\{1,\ldots,N\}$ can be coloured with $k$ colours in such a way that every four-term arithmetic progression contained in $\{1,\ldots,N\}$ receives at least three distinct colours. Estimate $h(N)$. This problem of Erdős and Freud is open; the best known bounds are
    $$\exp\left(c(\log N)^{1/9}\right) \ll h(N) \ll N^{\frac{\log 3}{\log 22}+o(1)}$$
    for some constant $c>0$, where $\frac{\log 3}{\log 22} \approx 0.355$. The upper bound is due to Zach Hunter, improving an earlier bound $h(N) \ll N^{2/3}$; the lower bound follows from recent progress on sets without three-term arithmetic progressions (Kelley–Meka, as refined by Bloom–Sisask).
