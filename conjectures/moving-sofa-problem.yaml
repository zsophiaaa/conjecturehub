id: moving-sofa-problem
title: Moving Sofa Problem
statement:
  informal: |-
    The hallway is the union of a horizontal corridor $(-\infty,1]\times[0,1]$ and a vertical corridor $[0,1]\times(-\infty,1]$, two strips of unit width meeting at a right angle. A **moving sofa** is a closed connected planar set that lies in the horizontal corridor and can be carried by a continuous rigid motion, remaining inside the hallway at all times, until it lies in the vertical corridor; the **sofa constant** is the largest area such a set can have. Gerver (1992) constructed a sofa $G$ whose boundary consists of $18$ analytic curve sections and whose area is $2.2195\ldots$, and Baek (2024) proved that no moving sofa has larger area, so the sofa constant equals $|G|$.

    What remains open is uniqueness: must every moving sofa of maximal area be a rigid copy of Gerver's sofa? Baek's proof bounds the area of an arbitrary moving sofa by a concave functional that is maximised at $G$ and agrees with the area there, but it does not assert that a competing maximiser has to coincide with $G$.
