id: erdos-304
title: Erdős Problem 304
statement:
  informal: |-
    For integers $1 \leq a < b$ let $N(a,b)$ denote the minimal $k$ such that there exist integers $1 < n_1 < \cdots < n_k$ with
    $$\frac{a}{b} = \frac{1}{n_1} + \cdots + \frac{1}{n_k},$$
    and let $N(b) = \max_{1\leq a<b} N(a,b)$ be the largest number of distinct unit fractions needed to write any fraction with denominator $b$. Estimate $N(b)$; in particular, is it true that $N(b) \ll \log\log b$? Erdős proved that
    $$\log\log b \ll N(b) \ll \frac{\log b}{\log\log b},$$
    and Vose improved the upper bound to $N(b) \ll \sqrt{\log b}$.
