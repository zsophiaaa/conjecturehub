    notes: Sharpened the construction to explicit exponent 1.014114…, making every step quantitative. Disproves both Erdős's n^{1+o(1)} conjecture and the weaker n^{1+O(1/log log n)} bound. Forum participants used ChatGPT to optimize finite parameters toward ~1.03–1.035.
