id: oeis-357513
title: general_supercongruence
statement:
  informal: |-
    For an integer $m \ge 0$ and $n \ge 1$, let $u_m(n)$ be the numerator, in lowest terms, of
    $$\sum_{k=1}^{n} \frac{1}{k^{2m+1}} \binom{n}{k}^{2} \binom{n+k}{k}^{2}.$$
    Peter Bala conjectured that for each fixed $m$ the supercongruence
    $$u_m(p-1) \equiv 0 \pmod{p^4}$$
    holds for all primes $p$ with only finitely many exceptions, the exceptional set depending on $m$. The case $m = 1$ is the OEIS sequence A357513, where the conjecture read: $u_1(p-1) \equiv 0 \pmod{p^4}$ for every prime $p \ge 3$ except $p = 7$ (checked up to $p = 499$).

    Known: both statements have since been proved. The case $m = 1$ was settled by AlphaProof (reported by Moritz Firsching, January 2026), and the general-$m$ conjecture by Ondrej Kutal (July 2026), who showed that the exceptional primes are exactly those $p$ for which $p - 1$ divides $2m + 4$ and $p$ does not divide $2m + 7$; in particular $p = 2$ is always exceptional, every exceptional prime satisfies $p \le 2m + 5$, and for $m = 1$ the exceptions are $p = 2$ and $p = 7$. For comparison, the Apéry numbers $A(n) = \sum_{k=0}^{n} \binom{n}{k}^2 \binom{n+k}{k}^2$ satisfy $A(p-1) \equiv 1 \pmod{p^3}$ for all primes $p \ge 5$.
