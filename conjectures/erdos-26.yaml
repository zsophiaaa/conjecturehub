  - id: erdos-26-davenport-erdos-prior-literature
    asserted_on: 2025-12-07
    type: resolved_by_prior_literature
    scope: the original question as stated, for arbitrary infinite A
    evidence_tier: published
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/26
      kind: forum
      quote: So I don't see why this question was asked 40 years later, as it seems to be trivially false.
    authors:
      - Wouter van Doorn
    notes: Points out that the question is settled negatively by 1951 work of Davenport and Erdős, which shows any Behrend sequence must have divergent reciprocal sum. Taking any infinite A with convergent reciprocal sum makes it immediate that no shift k can work.
  - id: erdos-26-divergent-reciprocal-counterexample
    asserted_on: 2025-11-24
    type: counterexample
    scope: strengthens the refutation to the case where the reciprocal sum of A diverges
    evidence_tier: community_accepted
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/26
      kind: forum
    authors:
      - Wouter van Doorn
    notes: Ruzsa's standard counterexample grows fast enough to have a convergent reciprocal sum, which made the refutation feel cheap. This modifies the construction by replacing the congruence range with one governed by any slowly growing function, so the density of A decays as slowly as desired and the reciprocal sum diverges while the counterexample survives.
  - id: erdos-26-tenenbaum-variant-disproof
    asserted_on: 2026-04-06
    type: disproved
    scope: Tenenbaum's weaker variant, not the original question
    evidence_tier: community_accepted
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/26
      kind: forum
    ai_assistance:
      used: yes
      systems:
        - DeepMind prover agent (product name not disclosed in thread)
      role: discovery
    notes: Posted by forum user GTsoukalas (no real name given on the site). Reports that a DeepMind prover agent found a Lean proof refuting Tenenbaum's weaker density variant. The construction builds A in blocks using arithmetic progressions chosen by CRT, each block contributing a fixed amount to a divergent reciprocal sum, giving upper density below 0.34.
  - id: erdos-26-aristotle-lean-formalisation
    asserted_on: 2025-12-28
    type: reformulation
    scope: Ruzsa's counterexample only, not the later strengthenings
    evidence_tier: community_accepted
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/26
      kind: forum
    authors:
      - Boris Alexeev
    ai_assistance:
      used: yes
      systems:
        - Aristotle (Harmonic)
      role: formalization
    notes: Harmonic's Aristotle auto-formalised Ruzsa's counterexample in Lean against the Formal Conjectures target statement. The poster explicitly notes he did not formalise the other results in the thread, including the divergent-reciprocal variant.
