  note: "Marked DISPROVED (LEAN) on erdosproblems.com. The original question was arguably never open, since Davenport and Erdős (1951) refutes it immediately — a point the 12-comment forum thread rediscovers with some bemusement. Live content moved to two strengthenings: van Doorn's slow-decay variant giving a counterexample with divergent reciprocal sum, and Tenenbaum's weaker density variant, reported refuted in April 2026 by a DeepMind prover agent. Remaining loose ends are bookkeeping: the page still describes Tenenbaum's variant as open."
