id: erdos-1084
title: Erdős Problem 1084
statement:
  informal: |-
    For $d\geq 1$ let $f_d(n)$ be the largest number of pairs at distance exactly $1$ that can occur among $n$ points of $\mathbb{R}^d$ whose pairwise distances are all at least $1$ (the contact number problem). Estimate $f_d(n)$.

    Known cases: $f_1(n)=n-1$, and Harborth [Ha74b] proved $f_2(n)=\lfloor 3n-\sqrt{12n-3}\rfloor$ for all $n\geq 2$, confirming Erdős's guess that the triangular lattice is optimal in the plane (in particular $f_2(3n^2+3n+1)=9n^2+3n$). In three dimensions Erdős claimed that $6n-c_1n^{2/3}<f_3(n)<6n-c_2n^{2/3}$ for some $c_1,c_2>0$, and Bezdek and Reid [BeRe13] proved $f_3(n)<6n-0.926\,n^{2/3}$ for all $n\geq 2$. In general only
    $$(d-o(1))n\leq f_d(n)\leq 2^{O(d)}n$$
    is known, the lower bound from an integer grid and the upper bound from the kissing number.
