      title: The McKay conjecture with coprime group automorphisms and the Okuyama-Wajima argument
      url: https://arxiv.org/abs/2512.13406
      kind: arxiv
      quote: if $P$ is an $A$-invariant Sylow $p$-subgroup of $G$ and $G$ is $p$-solvable, then there exists an $A$-equivariant (McKay) bijection between the irreducible characters of degree prime to $p$ of $G$ and those of \textbf{N}_G(P).
