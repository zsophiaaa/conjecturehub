id: erdos-358
title: Erdős Problem 358
statement:
  informal: |-
    Let $A=\{a_1<a_2<\cdots\}$ be an infinite strictly increasing sequence of positive integers, and for $n\geq 1$ let $f(n)$ be the number of pairs $u\leq v$ with
    $$n=\sum_{u\leq i\leq v}a_i,$$
    i.e. the number of ways of writing $n$ as a sum of consecutive terms of $A$. Is there such an $A$ with $f(n)\to\infty$ as $n\to\infty$, or even just with $f(n)\geq 2$ for all large $n$?

    The answer to both is yes: Tao [Ta26] constructed a sequence with $f(n)\gg\log n$ for all sufficiently large $n$. (Taking $a_n=n$ makes $f(n)$ the number of odd divisors of $n$, which does not tend to infinity.) Two questions of Erdős and Moser about the special case where $A$ is the sequence of primes remain open: is $\limsup_n f(n)=\infty$ then, and does the set of integers representable as a sum of consecutive primes have positive upper density?
