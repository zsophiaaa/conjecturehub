id: independent-domination-of-regular-graphs-conjecture-1-6
title: Independent Domination of Regular Graphs, Conjecture 1.6
statement:
  informal: |-
    **Conjecture 1.6 (Even case).**
    For a nonempty isolate-free graph $G$ on $n$ vertices,
    if $D$ is even, then $(D + 2)^2 \cdot i(G) \leq (D^2 + 4) \cdot n$.
