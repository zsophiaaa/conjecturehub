id: erdos-457
title: Erdős Problem 457
statement:
  informal: |-
    Is there some $\epsilon>0$ such that there are infinitely many $n$ for which every prime $p\leq(2+\epsilon)\log n$ divides
    $$\prod_{1\leq i\leq\log n}(n+i)?$$

    A problem of Erdős and Pomerance. Equivalently, writing $q(n,k)$ for the least prime not dividing $\prod_{1\leq i\leq k}(n+i)$, it asks whether $q(n,\log n)\geq(2+\epsilon)\log n$ for infinitely many $n$; taking $n$ to be a product of the primes between $\log n$ and $(2+o(1))\log n$ already gives $q(n,\log n)\geq(2+o(1))\log n$. The answer is yes, and the proof has been verified in Lean: a construction found by GPT-5.2 Pro (prompted by Barreto) works with the constant $2$ replaced by an arbitrarily large constant, and an elaboration sketched by Tao gives infinitely many $n$ with
    $$q(n,\log n)>\frac{1-o(1)}{2}\cdot\frac{\log\log n}{\log\log\log n}\log n.$$
    Matching upper bounds are not known; in particular it is open whether $q(n,\log n)<(1-\epsilon)(\log n)^2$ for all large $n$ and some $\epsilon>0$.
