id: the-s-3-conjecture-conjugacy-classes-of-distinct-sizes
title: The $S_3$-conjecture (conjugacy classes of distinct sizes)
statement:
  informal: |-
    **Markel's $S_3$-conjecture** (1973): any nontrivial finite ah-group is isomorphic to $S_3$.

    The conjecture is open in general; it is known to be true for solvable groups.
  formal:
    - language: lean4
      theorem: conjClassSizes_iff_sym_three
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Paper/ConjugacyClassSizes.lean
      toolchain: v4.32.0
