id: vcn-dimension-of-convex-sets-in-rn-rn-1-rn-2
title: VCₙ dimension of convex sets in ℝⁿ, ℝⁿ⁺¹, ℝⁿ⁺²
statement:
  informal: |-
    Take a convex set $C$ and the family of its translates. In the plane that family has VC
    dimension at most 3, but in $\mathbb R^3$ a convex set can shatter an infinite set. Replacing
    shattering by its $n$-fold analogue, $\mathrm{VC}_n$ dimension, moves the boundary up: for
    every $n$ there is a convex set in $\mathbb R^{n+2}$ whose $\mathrm{VC}_n$ dimension is
    infinite. One dimension lower is open, and this record collects three questions about it. Does
    every convex set in $\mathbb R^{n+1}$ have finite $\mathrm{VC}_n$ dimension at all, that is, is
    there a $d$ depending only on $n$ that bounds it? For $n \geq 2$, is that bound as small as 1?
    And in the first case $n = 2$, does every convex set in $\mathbb R^3$ have $\mathrm{VC}_2$
    dimension at most 1?
