id: erdos-741
title: Erdős Problem 741
statement:
  informal: |-
    Two questions of Burr and Erdős. First: if $A\subseteq\mathbb{N}$ is such that $A+A$ has positive upper density, can one always partition $A=A_1\sqcup A_2$ so that $A_1+A_1$ and $A_2+A_2$ both have positive upper density? Second: is there a basis $A$ of order $2$ (that is, a set with every natural number a sum of two elements of $A\cup\{0\}$) such that for every partition $A=A_1\sqcup A_2$ the sets $A_1+A_1$ and $A_2+A_2$ cannot both have bounded gaps?

    Both have been answered affirmatively. DeepMind's prover agent proved the upper-density form of the first question and, independently with an internal OpenAI model, constructed a basis answering the second; DeepMind also gave a counterexample to the first question read with the strict density (i.e. requiring the density to exist and be positive). The lower-density form of the first question — if $A+A$ has positive lower density, can $A$ be split so that $A_1+A_1$ and $A_2+A_2$ both have positive lower density? — remains open.
