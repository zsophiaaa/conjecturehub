openness_basis:
  meaning: no_published_solution_known_to_curator
  asserted_by: erdosproblems.com
  asserted_on: 2025-09-15
  note: "Open, and the site states it cannot be settled by a finite computation: the supremum is pinned but the infimum is only bracketed. With 141 comments this is the busiest problem thread on the forum. It has produced a steadily tightening lower bound on the infimum — 1.614, the golden ratio, 1.7, 1.7205, 1.806304, 1.8146, 1.814605 — against a conjectured value near 1.8344, so the remaining gap is roughly 0.02 rather than the 0.32 recorded on the problem page. Every one of these is a forum-only claim resting on numerical certificates of varying rigor, and the page's stated bound has not been updated, so page and thread currently disagree."
claims:
  - id: erdos-1038-two-atom-golden-ratio-bound
    asserted_on: 2026-01-01
    type: partial
    scope: lower bound on the infimum only
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1038
      kind: forum
      quote: The $\inf$ lower bound is in fact $\phi = \frac{1+\sqrt{5}}{2} \approx 1.6180$.
    authors:
      - jspier
    ai_assistance:
      used: yes
      systems:
        - ChatGPT
      role: discovery
    notes: Building on Tao's reduction that a minimizing measure may be assumed supported on a restricted set, jspier ran a brute-force search over two-atom measures, first reporting a lower bound of 1.614 and then identifying the true extreme point of the admissible region at the golden ratio. The dual-forcing step is a Fubini identity that forces at least one atom into the positive region. Discussed but not refereed.
  - id: erdos-1038-three-atom-sweep
    asserted_on: 2026-01-02
    type: partial
    scope: lower bound on the infimum; numerics described as empirical, not rigorous
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1038
      kind: forum
      quote: Since I expect someone will quickly find a better strategy, I have not optimized the parameters.
    authors:
      - J_Koizumi_144
      - Nat Sothanaphan
    ai_assistance:
      used: yes
      systems:
        - ChatGPT
      role: discovery
    notes: Extends the two-atom method to three atoms, sweeping one parameter to obtain a lower bound of 1.7, found by hand in Desmos rather than by optimization. Sothanaphan then optimized the same family to reach 1.7205, explicitly flagging the verification as empirical numerical checking that would need rigorous computation later. This already exceeds the 1.519 lower bound recorded on the problem page.
  - id: erdos-1038-five-atom-lean-certificate
    asserted_on: 2026-05-09
    type: partial
    scope: lower bound on the infimum; the Lean files check certificate arithmetic, not the reduction
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1038
      kind: forum
      quote: The useful gain came from making the five-atom certificate piecewise in the sweep parameter.
    authors:
      - Hua Xu
    notes: Pushes the finite-atom dual-forcing route to 1.806304 with a fixed five-atom certificate, then to 1.814600 using a piecewise five-atom certificate splitting the tail interval into 560 blocks. Adding six or more atoms did not help because the extra atoms took near-zero weight. A Lean and Mathlib certificate package is linked; it was not inspected or compiled for this record.
  - id: erdos-1038-family-ceiling-extension
    asserted_on: 2026-06-10
    type: partial
    scope: lower bound on the infimum; the claimed ceiling is evidence from local searches, not proof
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1038
      kind: forum
      quote: The searches are local, so that's evidence of a family ceiling, not exhaustion.
    authors:
      - mendozalab
    notes: Extends the certificate to 1.814605, re-solving per-block weights by linear programming and checking both computational legs in directed interval arithmetic with a second backend. The more interesting claim is that the method appears to stop there, which the author is careful to call evidence of a family ceiling rather than exhaustion. Sothanaphan pushed back on the writeup's undefined terms and the author agreed to revise contradictory verification language.
