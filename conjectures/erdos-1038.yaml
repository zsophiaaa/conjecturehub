openness_basis:
  asserted_by: erdosproblems.com
  asserted_on: 2025-09-15
  meaning: no_published_solution_known_to_curator
  note: >-
    Open, and the site states it cannot be settled by a finite computation: the supremum is pinned
    but the infimum is only bracketed. With 141 comments this is the busiest problem thread on the
    forum. It has produced a steadily tightening lower bound on the infimum — 1.614, the golden
    ratio, 1.7, 1.7205, 1.806304, 1.8146, 1.814605 — against a conjectured value near 1.8344, so
    the remaining gap is roughly 0.02 rather than the 0.32 recorded on the problem page. Every one
    of these is a forum-only claim resting on numerical certificates of varying rigor, and the
    page's stated bound has not been updated, so page and thread currently disagree.
