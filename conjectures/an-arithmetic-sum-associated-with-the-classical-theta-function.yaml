id: an-arithmetic-sum-associated-with-the-classical-theta-function
title: An Arithmetic Sum Associated with the Classical Theta Function
statement:
  informal: |-
    **Conjecture 1.1**: For any odd prime $k$, the sum associated with the classical theta function $θ_3$,
    $S(k)$ is positive.
