openness_basis:
  meaning: no_published_solution_known_to_curator
  asserted_by: erdosproblems.com
  asserted_on: 2026-01-05
  note: "Marked PROVED (LEAN), but closure is unusually interpretation-dependent: as literally stated the question admits trivial solutions and was, in the maintainers' words, more of an idle remark than a formal conjecture, so what was resolved is a community reconstruction of intent. Within that reading the result is well supported by a Lean formalization, an independently simplified second formalization, and an arXiv writeup, and a literature search established that prior work covers only the stronger variant. The 87-comment thread also records a verification win in the other direction: a genuine gap was found in a cited lemma and the author revised it. One live loose end is a July claim of two further deterministic proofs which sat unanswered and should not be treated as accepted."
