  - id: erdos-728-gpt52-aristotle-resolution
    asserted_on: 2026-01-06
    type: proved
    scope: the interpretation with the additional constraint that a and b are bounded away from n
    evidence_tier: preprint
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/728
      kind: forum
      quote: I believe we have reached a consensus that this should constitute a non-trivial, full resolution to the problem.
    authors:
      - Kevin Barreto
      - Boris Alexeev
    ai_assistance:
      used: yes
      systems:
        - GPT-5.2
        - Aristotle (Harmonic)
        - Claude 4.5 Opus
      role: discovery
    notes: Barreto posted a GPT-5.2 argument, formalized by Harmonic's Aristotle, resolving the problem under the intended constraint. The key move exploits the factorial denominator already present, dropping the expected p-valuation enough to survive. Tao noted the informal proof has slight gaps but judged the formal proof addresses them. Alexeev re-ran Aristotle on the output to produce a file about a third shorter that also proves the Formal Conjectures statement.
  - id: erdos-728-prior-literature-scoping
    asserted_on: 2026-01-06
    type: resolved_by_prior_literature
    scope: applies only to the stronger variant and only for small constants
    evidence_tier: unverified_claim
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/728
      kind: forum
    authors:
      - Terence Tao
    notes: Forum user KoishiChan found that Erdős's 1975 paper already remarks on a related divisibility holding outside a density-zero set, with a full proof in a 1968 Elemente der Mathematik solution. Tao examined both and concluded they pertain to the stronger variant and hold only for sufficiently small constants, whereas the version actually obtained appears to be new. Recorded because it delimits exactly what the AI contribution added over the literature.
  - id: erdos-728-unified-density-one-generalization
    asserted_on: 2026-01-18
    type: partial
    scope: a generalization having problems 728, 729 and 401 as corollaries
    evidence_tier: preprint
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/728
      kind: forum
      quote: This unifies all related results so far.
    authors:
      - Nat Sothanaphan
    ai_assistance:
      used: yes
      systems:
        - ChatGPT
      role: writing
    notes: Sothanaphan wrote up the Lean proof to journal standard as arXiv 2601.07421, then extracted a unified theorem having this problem and two others as corollaries. He reports the constant is plausibly optimal by a heuristic he cannot prove. Tao reviewed the draft and asked for the degeneracy-excluding constraint to be imposed in the abstract, which was done.
  - id: erdos-728-two-deterministic-agent-proofs
    asserted_on: 2026-07-13
    type: proved
    scope: claimed alternative proofs of an already-resolved problem; no community response observed
    evidence_tier: unverified_claim
    attestation: secondary
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/728
      kind: forum
      quote: Both of the proofs are deterministic, distinguishing them from the January proof.
    ai_assistance:
      used: yes
      systems:
        - unnamed AI research agent
      role: discovery
    notes: Forum user JPickhardt reported that an AI research agent under development, using this problem as a test case, generated two methodologically distinct solutions, both deterministic in contrast to the January proof. As of retrieval this was the most recent post in the thread and had drawn no replies, so it has received no community scrutiny. The linked papers were not fetched and are deliberately not cited here.
