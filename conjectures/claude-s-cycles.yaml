      theorem: cube_hamiltonian_arc_decomposition
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Paper/ClaudesCycles.lean
      toolchain: v4.32.0
      category: research solved
      definition_hole: false
    - language: lean4
      theorem: cube_hamiltonian_arc_decomposition_impossible_m2
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Paper/ClaudesCycles.lean
      toolchain: v4.32.0
      category: research solved
      definition_hole: false
    - language: lean4
      theorem: cube_hamiltonian_arc_decomposition_even
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Paper/ClaudesCycles.lean
      toolchain: v4.32.0
