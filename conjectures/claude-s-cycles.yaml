    notes: 'The 14 April 2026 revision adds a "Breaking news" section: $m = 4$ and $m = 6$ by explicit search certificates, and all even $m \geq 8$ by a construction of Ho Boon Suan with a correctness proof generated by GPT-5.4 Pro. Filed at the lowest tier deliberately. The general even-$m$ argument is an AI-generated write-up hosted on a personal website, with no journal, no arXiv posting and no proof-assistant check; the existing Lean work covers only the odd case, and a follow-up construction by Keston Aquino-Michaels is verified only computationally to $m = 2000$. Worth a curator revisiting before this is treated as settled.'
