id: claude-s-cycles
title: Claude's Cycles
statement:
  informal: |-
    Give each vertex of $(\mathbb{Z}/m\mathbb{Z})^3$ an arc to the three vertices reached by
    adding one to a single coordinate. Can the arcs of the resulting digraph be partitioned into
    three arc-disjoint Hamiltonian cycles? No such partition exists for $m = 2$, and the odd case
    is settled; even $m > 2$ is the case at issue, with a resolution reported but not refereed.
