      url: https://www.erdosproblems.com/forum/thread/647
      kind: forum
    authors:
      - Scott D. Hughes
    notes: "Independent Python certificate (verify.py): no solution with 24 < n ≤ 6.16×10^17 on the 41-class frontier. 6549 sub-classes ruled out by fixed congruences; remainder by search to u=10^7 with some shift k≤16 over budget. Date deliberately omitted: Hughes posted on 27 and 29 May and 8 and 15 June 2026, and this contribution was not pinned to one of them."
  - id: erdos-647-ellis-mod12-partial
    asserted_on: 2026-05-27
