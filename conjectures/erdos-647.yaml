    source:
      title: Partial Resolution of Erdős Problem
      url: https://doi.org/10.5281/zenodo.20405507
      kind: preprint
    authors:
      - Matteas Ellis
    notes: Proves G(n)=max_{m<n}(m+τ(m))-n ≥ 3 for all n>24 with n≢0 (mod 12). Remaining class n≡0 (mod 12) verified to 10^8 and reduced to nested Sophie Germain primality condition.
  - id: erdos-647-kitamura-sieve-bound
