  informal: |-
    Let $\tau(n)$ count the number of divisors of $n$. Is there some $n > 24$ such that
    $$
     \max_{m < n}(m + \tau(m)) \leq n + 2?
    $$
    Known solutions: 5, 8, 10, 12, 24 (OEIS A087280). Erdős offered £25 for any larger example.
    Discussion and partial results: [erdosproblems.com forum #647](https://www.erdosproblems.com/forum/thread/647).
