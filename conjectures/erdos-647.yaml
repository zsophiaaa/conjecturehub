    ai_assistance:
      used: yes
      systems:
        - Claude (Anthropic)
      role: writing
    notes: Computational verification to n=10^12 via segmented multiplicative sieve. No n in (24, 10^12] satisfies the inequality. Minimum gap R(n)-n was 224 near 10^11. Extends OEIS A087280 bound of 10^10. C source and report on Zenodo.
  - id: erdos-647-hughes-modular-reduction
    asserted_on: 2026-05-27
    type: partial
    evidence_tier: preprint
    attestation: secondary
    state: active
