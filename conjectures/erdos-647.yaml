  - asserted_on: 2026-06-13
    authors:
      - Patrik Idén
    evidence_tier: preprint
    id: erdos-647-iden-verification-10e12
    notes: >-
      Computational verification to n=10^12 via segmented multiplicative sieve. No n in (24, 10^12]
      satisfies the inequality. Minimum gap R(n)-n was 224 near 10^11. Extends OEIS A087280 bound
      of 10^10. C source and report on Zenodo.
    ai_assistance:
      used: yes
      systems:
        - Claude (Anthropic)
      role: writing
    recorded_on: 2026-08-02
    source:
      kind: forum
      title: erdosproblems.com forum — Patrik Idén, June 2026
      url: https://www.erdosproblems.com/forum/thread/647
      quote: No solution was found in (24, 10^12].
    state: active
    type: partial
    scope: n ≤ 10^12
  - asserted_on: 2026-06-01
    authors:
      - Scott D. Hughes
    evidence_tier: preprint
    id: erdos-647-hughes-modular-reduction
    notes: >-
      Lean-verified reduction for n>84 to n=2520N with 41 open residue classes mod 46189 (55 of 96
      survivors closed). Includes prime-chain reduction and density bounds; explicitly not a full
      resolution — one intentional Stage-1 axiom remains in the Lean development.
    recorded_on: 2026-08-02
    source:
      kind: forum
      title: erdosproblems.com forum — Scott D. Hughes
      url: https://www.erdosproblems.com/forum/thread/647
    state: active
    type: partial
  - asserted_on: 2026-06-01
    authors:
      - Scott D. Hughes
    evidence_tier: preprint
    id: erdos-647-hughes-frontier-certificate
    notes: >-
      Independent Python certificate (verify.py): no solution with 24 < n ≤ 6.16×10^17 on the
      41-class frontier. 6549 sub-classes ruled out by fixed congruences; remainder by search to
      u=10^7 with some shift k≤16 over budget.
    recorded_on: 2026-08-02
    source:
      kind: forum
      title: erdosproblems.com forum — Scott D. Hughes frontier-certificate
      url: https://www.erdosproblems.com/forum/thread/647
    state: active
    type: partial
    scope: n ≤ 6.16×10^17 on 41-class frontier
  - asserted_on: 2026-05-27
    authors:
      - Matteas Ellis
    evidence_tier: preprint
    id: erdos-647-ellis-mod12-partial
    notes: >-
      Proves G(n)=max_{m<n}(m+τ(m))-n ≥ 3 for all n>24 with n≢0 (mod 12). Remaining class n≡0
      (mod 12) verified to 10^8 and reduced to nested Sophie Germain primality condition.
    recorded_on: 2026-08-02
    source:
      kind: preprint
      title: Partial Resolution of Erdős Problem #647 (Zenodo)
      url: https://doi.org/10.5281/zenodo.20405507
    state: active
    type: partial
    scope: n ≢ 0 (mod 12)
  - asserted_on: 2026-06-01
    authors:
      - Kenta Kitamura
    evidence_tier: preprint
    id: erdos-647-kitamura-sieve-bound
    notes: >-
      Combining forced shifts k∈{2,3,4,6,12} with prime-chain forms yields admissible 7-tuples;
      Brun sieve gives |C(x)| ≪ x/(log x)^7 unconditionally. Density-zero refinement only.
    ai_assistance:
      used: yes
      role: writing
    recorded_on: 2026-08-02
    source:
      kind: forum
      title: erdosproblems.com forum — Kenta Kitamura
      url: https://www.erdosproblems.com/forum/thread/647
    state: active
    type: partial
  - asserted_on: 2026-01-01
    authors:
      - Anonymous (forum)
    evidence_tier: unverified_claim
    id: erdos-647-claimed-complete-disputed
    notes: >-
      Forum post claimed a complete proof via record-holder domination intervals covering all n>24,
      with Lean on Zenodo 18390414. Other forum contributors noted the asymptotic overlap step is
      unproven and axiomized in Lean — not accepted as a resolution. erdosproblems.com lists 0
      claimed proofs for this problem.
    ai_assistance:
      used: yes
      systems:
        - ChatGPT 5.2
        - Gemini
        - Deepseek Thinking
      role: discovery
    recorded_on: 2026-08-02
    source:
      kind: forum
      title: erdosproblems.com forum — disputed complete-proof claim
      url: https://www.erdosproblems.com/forum/thread/647
    state: disputed
    type: partial
    scope: alleged proof that no n > 24 exists
  - asserted_on: 2026-04-01
    authors:
      - Terence Tao
    evidence_tier: community_accepted
    id: erdos-647-tao-problem-relation
    notes: >-
      τ(m) is similar to 2^ω(m); #647 is similar to but slightly weaker than part of Erdős #679,
      and much stronger than #413 or #248. Context for proof strategy, not a resolution.
    recorded_on: 2026-08-02
    reviewer: erdosproblems.com forum attribution
    source:
      kind: forum
      title: erdosproblems.com problem page — Tao comment (via Bloom)
      url: https://www.erdosproblems.com/647
    state: active
    type: reformulation
