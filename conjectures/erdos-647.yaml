      title: erdosproblems.com forum — Scott D. Hughes
      url: https://www.erdosproblems.com/forum/thread/647
      kind: forum
    authors:
      - Scott D. Hughes
    notes: Lean-verified reduction for n>84 to n=2520N with 41 open residue classes mod 46189 (55 of 96 survivors closed). Includes prime-chain reduction and density bounds; explicitly not a full resolution — one intentional Stage-1 axiom remains in the Lean development.
  - id: erdos-647-hughes-frontier-certificate
    type: partial
    scope: n ≤ 6.16×10^17 on 41-class frontier
