openness_basis:
  meaning: no_published_solution_known_to_curator
  asserted_by: erdosproblems.com
  asserted_on: 2026-04-16
  note: "Marked PROVED (LEAN) on erdosproblems.com, so the question is not whether the result holds but how much of the surrounding 90-comment discussion is settled. The core bound and the arXiv account by eight named authors are solid, but a substantial fraction of the thread is forum-only refinement — the exact invariant measure, a sharper variant, the constant in the secondary term, and permutation and function-field analogues — none separately refereed. A distinct unresolved thread concerns AI provenance: Tao repeatedly noted the published chain of thought never mentions the von Mangoldt function, so the decisive step remains opaque, and ten independent reruns reached the result by related but distinct routes without surfacing it."
