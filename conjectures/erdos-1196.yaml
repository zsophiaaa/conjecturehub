    notes: Imported from the upstream `research solved` category. The statement is formalized; the proof has not been machine-checked by ConjectureHub.
  - id: erdos-1196-gpt54pro-primitive-set-bound
    asserted_on: 2026-04-13
    type: proved
    evidence_tier: preprint
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1196
      kind: forum
      quote: GPT-5.4 Pro claims a solution here.
    authors:
      - Liam Price
    ai_assistance:
      used: yes
      systems:
        - GPT-5.4 Pro
      role: discovery
    notes: Price posted a GPT-5.4 Pro solution proving that for any primitive set the tail sum is at most 1 plus O(1/log x), superseding Lichtman's bound. The argument builds a downward Markov chain driven by the von Mangoldt identity and bounds the primitive sum by the hitting probability of a truncated adjoint chain. Price described it as a one-shot result in about 80 minutes. An account by eight authors appeared on arXiv as 2605.00301.
  - id: erdos-1196-tao-discrete-divergence-reformulation
    asserted_on: 2026-04-17
    type: reformulation
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1196
      kind: forum
      quote: I've managed to rearrange the proof to not explicitly mention any Markov chains at all.
    authors:
      - Terence Tao
    notes: Tao rewrote the proof to eliminate explicit Markov chains, using a discrete divergence theorem on a flow graph. The von Mangoldt identity makes the outflow exact and Mertens makes the inflow match, so the flow is nearly divergence-free on the tail; primitivity enters at exactly one point. Tao later called this rewriting obsolete in light of subsequent streamlined proofs, and Sothanaphan produced a pure resummation variant.
  - id: erdos-1196-canonical-invariant-measure
    asserted_on: 2026-04-15
    type: partial
    scope: sharpened error term and an exact inequality, not a new resolution
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1196
      kind: forum
    authors:
      - Kevin Barreto
      - Will Sawin
      - Terence Tao
    ai_assistance:
      used: yes
      systems:
        - GPT-5.4 Pro
      role: discovery
    notes: Tao conjectured a canonical measure exactly invariant under the downward process. Barreto gave the closed form as a Mellin-type integral; Sawin independently verified the functional equation, having reached the same formula via the function field model. This yields a clean exact inequality for primitive sets, and elementary bounds then recover the main result. Sawin also proposed a refinement that is sharp for a natural family but not asymptotically smooth.
  - id: erdos-1196-permutation-analogue
    asserted_on: 2026-04-20
    type: reformulation
    scope: analogue on the poset of permutations, not the integer problem
    evidence_tier: unverified_claim
    state: active
    recorded_on: 2026-08-02
    source:
      title: erdosproblems.com forum
      url: https://www.erdosproblems.com/forum/thread/1196
      kind: forum
      quote: It has the neat feature of being nonasymptotic, as no Mertens type estimates are needed.
    notes: Posted by forum user ofir; the linked writeup is hosted on Ofir Gorodetsky's site, so the identification is inferred rather than stated in-thread. Proves that for a primitive set of permutations an analogous sum is at most 1, with the role of the von Mangoldt identity played by the fact that a permutation's size is the sum of its cycle sizes. Notable for being nonasymptotic, since no Mertens-type estimate is needed.
