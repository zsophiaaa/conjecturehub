id: erdos-390
title: Erdős Problem 390
statement:
  informal: |-
    For $n \geq 1$ let $f(n)$ be the least integer $m$ for which $n!$ can be written as a product of distinct integers all greater than $n$ with largest factor $m$; that is, the minimal $m$ such that $n! = a_1\cdots a_k$ with $n < a_1 < \cdots < a_k = m$. Is there a constant $c$ such that
    $$f(n) - 2n \sim c\,\frac{n}{\log n}$$
    as $n\to\infty$, and if so, what is its value? Erdős, Guy and Selfridge proved the corresponding order-of-magnitude statement $f(n) - 2n \asymp \frac{n}{\log n}$.
