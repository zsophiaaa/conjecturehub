id: erdos-138
title: Erdős Problem 138
statement:
  informal: |-
    For $k\geq 1$ let the van der Waerden number $W(k)$ be the least $N$ such that every $2$-colouring of $\{1,\ldots,N\}$ contains a monochromatic $k$-term arithmetic progression. Improve the bounds on $W(k)$; in particular, Erdős asked whether
    $$\lim_{k\to\infty} W(k)^{1/k} = \infty,$$
    and offered \$500 for a proof or disproof. The best known general lower bound is $W(k) \gg 2^k$, due to Kozik and Shabanov, together with Berlekamp's bound $W(p+1) \geq p2^p$ for primes $p$; the best known upper bound is Gowers' tower-type bound $W(k) \leq 2^{2^{2^{2^{2^{k+9}}}}}$, from his proof of Szemerédi's theorem.
