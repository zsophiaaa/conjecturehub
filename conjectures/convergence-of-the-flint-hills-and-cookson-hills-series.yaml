id: convergence-of-the-flint-hills-and-cookson-hills-series
title: Convergence of the Flint Hills and Cookson Hills series
statement:
  informal: |-
    The Flint Hills series summing $csc(n)^2 / n^3$ from $n=1$ to $\infty$ converges.
    (Note that we 0-index the series below.)
  formal:
    - language: lean4
      theorem: flint_hills_series_converges
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/FlintCooksonHills.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
    - language: lean4
      theorem: cookson_hills_series_converges
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Wikipedia/FlintCooksonHills.lean
