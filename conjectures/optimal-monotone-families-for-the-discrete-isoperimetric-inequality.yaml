id: optimal-monotone-families-for-the-discrete-isoperimetric-inequality
title: Optimal monotone families for the discrete isoperimetric inequality
statement:
  informal: |-
    Fix $X=\{1,\dots,n\}$ and, for $0<p<1$, let $\mu_p$ be the product measure on subsets of $X$ in which each element is included independently with probability $p$. For a family $\mathcal F$ of subsets of $X$, write $\mu_p(\mathcal F)$ for its measure, and let the edge boundary $I^p(\mathcal F)$ be the $\mu_p$-expected number of coordinates $i$ for which exactly one of $S$ and $S\,\triangle\,\{i\}$ belongs to $\mathcal F$. The discrete isoperimetric inequality says that
    $$I^p(\mathcal F)\;\ge\;\frac{\mu_p(\mathcal F)\log\bigl(1/\mu_p(\mathcal F)\bigr)}{p\,\log(1/p)}$$
    for every family and every $p$; call $\mathcal F$ *optimal at $p$* if this is sharp up to the factor $1000\log(1/p)$, that is, if $p\,I^p(\mathcal F)\le 1000\,\mu_p(\mathcal F)\log\bigl(1/\mu_p(\mathcal F)\bigr)$. Call $\mathcal F$ monotone increasing if $S\in\mathcal F$ and $S\subseteq T$ imply $T\in\mathcal F$.

    Kahn and Kalai (2006, Conjecture 7) asked: for every monotone increasing $\mathcal F$ and every $0<s\le t<1$ with $\mu_t(\mathcal F)=1/2$ and $t/s>1000\log n$, must $\mathcal F$ be optimal at some $p\in[s,t]$? The answer is no. For every constant $C$ and every $\varepsilon>0$ there are arbitrarily large monotone increasing families, together with $0<s<t<1$ satisfying $\mu_t(\mathcal F)=1/2$ and $t/s\ge n^{1/(C+1+\varepsilon)}$, for which $p\,I^p(\mathcal F)>C\,\mu_p(\mathcal F)\log(1/\mu_p(\mathcal F))$ at every $p\in[s,t]$. So the required window is polynomial rather than logarithmic in $n$, and the weaker theorem Kahn and Kalai did prove — that for each $\varepsilon>0$ some constant $C(\varepsilon)$ works once $t/s>C(\varepsilon)\,n^{\varepsilon}$ — is essentially best possible.
