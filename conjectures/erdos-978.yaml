id: erdos-978
title: Erdős Problem 978
statement:
  informal: Let $f \in \mathbb{Z}[x]$ be an irreducible polynomial with positive leading coefficient whose degree $k>2$ is not a power of $2$, and call an integer *$j$-power-free* if it is not divisible by the $j$-th power of any prime. Suppose $k>3$ and that for every prime $p$ there is some $n$ with $p^{k-2} \nmid f(n)$. Are there then infinitely many $n$ for which $f(n)$ is $(k-2)$-power-free? Erdős proved that infinitely many $n$ give $(k-1)$-power-free values, and Hooley showed that such $n$ in fact have positive density; for the harder $(k-2)$-power-free question Heath-Brown gave a positive answer for $k \geq 10$ and Browning extended this to $k \geq 9$, so the remaining open degrees are $k = 5, 6, 7$. Erdős also asked the concrete question, still open, of whether $n^4+2$ represents infinitely many squarefree numbers.
