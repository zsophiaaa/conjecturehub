id: gauss-circle-problem
title: Gauss circle problem
statement:
  informal: |-
    For $r \geq 0$ let
    $$N(r) = \#\{(m,n) \in \mathbb{Z}^2 : m^2+n^2 \leq r^2\}$$
    be the number of integer lattice points in the closed disk of radius $r$ about the origin, and let $E(r) = N(r) - \pi r^2$ be the error in approximating that count by the area of the disk. Hardy conjectured that this error is essentially of square-root size: is $E(r) = O(r^{1/2+\varepsilon})$ for every $\varepsilon > 0$? Gauss's elementary argument gives $|E(r)-2| \leq 2\sqrt{2}\,\pi r$ for $r \geq \sqrt2$. Writing $E(r) \ll r^{t}$, the known constraints on the exponent are
    $$\tfrac12 < t \leq \tfrac{131}{208} = 0.6298\ldots,$$
    the lower restriction coming from Hardy and Landau (1915), who showed independently that $|E(r)| \neq o\bigl(r^{1/2}(\log r)^{1/4}\bigr)$, and the upper bound being due to M. N. Huxley.
