id: erdos-1095
title: Erdős Problem 1095
statement:
  informal: |-
    For $k\geq 1$ let $g(k)$ be the least integer $n>k+1$ such that every prime factor of $\binom{n}{k}$ is greater than $k$ (the Erdős–Selfridge function). Estimate $g(k)$.

    Ecklund, Erdős, and Selfridge [EES74] proved $k^{1+c}<g(k)\leq\exp((1+o(1))k)$ for some $c>0$, and conjectured that $g(k)<[1,\ldots,k]$, the least common multiple of the integers up to $k$, for all large $k$, as well as $\limsup_k g(k+1)/g(k)=\infty$ and $\liminf_k g(k+1)/g(k)=0$. Konyagin [Ko99b] holds the strongest lower bound to date,
    $g(k)\gg\exp\!\big(c(\log k)^2\big).$
    A far larger growth rate, $g(k)\geq\exp(ck/\log k)$, was anticipated in [ELS93], and Sorenson, Sorenson, and Webster [SSW20] give heuristic evidence that $\log g(k)\asymp k/\log k$.
