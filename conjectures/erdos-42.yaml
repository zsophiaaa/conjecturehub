id: erdos-42
title: "Erdős Problem 42: Maximal Sidon Sets and Disjoint Difference Sets"
statement:
  informal: |-
    A set of integers is a Sidon set if all of its pairwise sums $a+a'$ with $a\leq a'$ are distinct, equivalently if all of its non-zero differences are distinct. Fix $M\geq 1$ and take $N$ large compared with $M$. Given any Sidon set $A\subseteq\{1,\ldots,N\}$, must there be a further Sidon set $B\subseteq\{1,\ldots,N\}$ with $|B|=M$ and $(A-A)\cap(B-B)=\{0\}$?

    (Only maximal $A$ need be considered, since a $B$ that works for a Sidon set also works for all of its subsets.) The answer is yes for every $M$, proved by GPT-5.5 Pro prompted by Sandhu, with the argument reported to produce such a $B$ of size $\gg\big(\frac{\log\log N}{\log\log\log N}\big)^{1/2}$; the cases $M\leq 3$ had been handled earlier by Sedov. Giving an explicit admissible threshold, i.e. a function $f$ such that $N\geq f(M)$ always suffices, appears to remain open.
