id: erdos-42
title: "Erdős Problem 42: Maximal Sidon Sets and Disjoint Difference Sets"
statement:
  informal: |-
    **Erdős Problem 42**: Let M ≥ 1 and N be sufficiently large in terms of M. Is it true that for every
    maximal Sidon set `A ⊆ {1,…,N}` there is another Sidon set `B ⊆ {1,…,N}` of size M such that
    `(A - A) ∩ (B - B) = {0}`?

    This was proved for all $M$ by GPT 5.5 Pro (prompted by Sandhu), see discussion thread for more details.
  formal:
    - language: lean4
      theorem: erdos_42
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/ErdosProblems/42.lean
      toolchain: v4.32.0
      category: research solved
      definition_hole: false
    - language: lean4
      theorem: erdos_42.variants.constructive
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/ErdosProblems/42.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
