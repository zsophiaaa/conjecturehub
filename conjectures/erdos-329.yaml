id: erdos-329
title: "Erdős Problem 329: Maximum Density of Sidon Sets"
statement:
  informal: |-
    **Erdős Problem 329.**
    Let `A ⊆ ℕ` be a Sidon set. How large can
    `lim sup_{N → ∞} |A ∩ {1,…,N}| / N^{1/2}`
    be?
