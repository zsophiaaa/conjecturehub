id: erdos-183
title: Erdős Problem 183
statement:
  informal: |-
    **Multicolor triangle Ramsey numbers (Erdős 183).** How fast do multicolor triangle Ramsey
    numbers `R_k` grow? OpenAI Astra (August 2026) announced a superexponential lower bound,
    proving `(R_k)^{1/k} → ∞`, with a Lean 4 certificate in openai/ten-proofs. Read the full
    problem at erdosproblems.com/183.
