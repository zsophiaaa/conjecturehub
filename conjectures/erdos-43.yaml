      theorem: erdos_43.parts.i
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/ErdosProblems/43.lean
      toolchain: v4.32.0
      category: research solved
      definition_hole: false
    - language: lean4
