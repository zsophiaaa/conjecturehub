id: erdos-1085
title: Erdős Problem 1085
statement:
  informal: |-
    For $d\geq 1$ let $f_d(n)$ be the largest number of pairs at distance exactly $1$ that can occur among $n$ points of $\mathbb{R}^d$ (with no separation assumption on the points). Estimate $f_d(n)$.

    The difficult cases are $d=2$ and $d=3$. For $d=2$ this is the Erdős unit distance problem, where the best known upper bound is $f_2(n)\ll n^{4/3}$, due to Spencer, Szemerédi, and Trotter [SST84], while Erdős's classical lower bound is $f_2(n)>n^{1+c/\log\log n}$ for some $c>0$. For $d=3$ it is known that
    $$n^{4/3}\log\log n\ll f_3(n)\ll n^{3/2}\beta(n)$$
    for a very slowly growing function $\beta$, the lower bound due to Erdős [Er60b] and the upper bound to Clarkson, Edelsbrunner, Guibas, Sharir, and Welzl [CEGSW90]. For $d\geq 4$ the answer is quadratic: with $p=\lfloor d/2\rfloor$, a construction of Lenz gives $f_d(n)\geq\frac{p-1}{2p}n^2-O(1)$ and Erdős deduced the matching upper bound $f_d(n)\leq(\frac{p-1}{2p}+o(1))n^2$ from the Erdős–Stone theorem; the exact value is known for $d=4$ (Brass [Br97]) and for all even $d\geq 6$ (Swanepoel [Sw09]).
