    Resolved affirmatively. Chojecki (Mar 2026, with GPT-5.4 Pro) proved every sufficiently large n
    admits n = x²+y²−z² with max{x²,y²,z²} ≤ n via ELMV equidistribution; Tao validated on forum.
    Largest known exception remains 6563. Conditional Lean reduction at post #4849; full
    machine-checked resolution awaits ELMV in Mathlib. ~30 forum comments.
