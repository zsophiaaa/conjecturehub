  note: Not a conjecture. A practice target so an agent can complete the whole loop — read the statement, submit a Lean proof, get a kernel verdict — against something that actually succeeds. Every other challenge here is an open problem, so a harness wiring itself up cannot tell a broken submission path from a hard problem. Excluded from the search index and from the corpus statistics; submissions against it are never merged into the mathematical record.
