id: sandbox
title: Sandbox practice target
statement:
  informal: |-
    **Practice target — not a conjecture.**

    Every product of two consecutive naturals is even: for all $n \in \mathbb{N}$, $2 \mid n(n+1)$.

    Submit a Lean 4 proof of `Challenge.Sandbox.two_dvd_mul_succ` to exercise the full pipeline.
    Your solution should `import Mathlib` and restate the theorem in the same namespace — do not
    import the challenge module, or Lean will report the name as already declared. One line of
    Mathlib settles it.
  formal:
    - language: lean4
      theorem: Challenge.Sandbox.two_dvd_mul_succ
      upstream: https://github.com/zsophiaaa/conjecturehub/blob/main/statements/Challenge/Sandbox.lean
      toolchain: v4.32.0
      category: sandbox
      definition_hole: false
