id: erdos-655
title: Erdős Problem 655
statement:
  informal: |-
    Let $x_1,\ldots,x_n\in\mathbb{R}^2$ be points such that no circle centred at one of the $x_i$ passes through three of the others. Must the $x_i$ determine at least
    $$(1+c)\frac{n}{2}$$
    distinct pairwise distances, for some absolute constant $c>0$ and all sufficiently large $n$?

    A problem of Erdős and Pach. The hypothesis immediately gives at least $\frac{n-1}{2}$ distinct distances from each individual point. As literally stated the answer is no: Hunter observed that $n$ points equally spaced on a circle satisfy the hypothesis yet determine only $\lfloor n/2\rfloor$ distinct distances. Presumably some general position hypothesis was intended (for instance no three of the points collinear and no four concyclic), and the question with such a hypothesis added is open.
