id: unique-crystal-components
title: Unique Crystal Components
statement:
  informal: |-
    If $n = ab$ is a crystal, then there are no other pairs of
    positive integers $c, d > 1$, different from the couple $a, b$, such that $n = cd$ and
    $B(c, d) ∈ ℕ$, i.e., the components of the crystals are unique.
  formal:
    - language: lean4
      theorem: crystals_components_unique
      upstream: https://github.com/google-deepmind/formal-conjectures/blob/v4.32.0/FormalConjectures/Arxiv/1601.03081/UniqueCrystalComponents.lean
      toolchain: v4.32.0
      category: research open
      definition_hole: false
