openness_basis:
  asserted_by: erdosproblems.com
  asserted_on: 2025-08-31
  meaning: no_published_solution_known_to_curator
  note: >-
    Still marked OPEN on erdosproblems.com, and the 14-comment forum thread is unusually clear
    about why. Erdős stated the question in ways that differ from the Burr–Erdős–Graham–Li
    original: his version permits the power d^0 = 1 and omits the gcd hypothesis, and Aristotle
    proved exactly that easier variant with a short elementary argument formalised in Lean. Both
    the contributor and the maintainer concluded this settles a different question, so the main
    statement was rewritten to carry the gcd condition and the status left open. Tao's
    contributions delimit what is known: Pomerance's necessity argument covers only finite sets.
