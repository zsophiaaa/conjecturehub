id: oeis-41
title: noPowerPartitionNumber
statement:
  informal: |-
    There are no partition numbers $p(k)$ of the form $x^m$, with $x,m$ integers $>1$.
    See comment by Zhi-Wei Sun (Dec 02 2013).
